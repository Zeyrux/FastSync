[pytest]
; Fast integration subset run on every pull request (see .gitea/workflows/ci.yaml).
markers =
    ci: fast, representative integration tests run on the PR CI gate
    setpriv: privilege-dependent tests (drop to an unprivileged user); excluded
        from CI because their result depends on the runner/container uid and the
        host mount permissions, but run locally as root
    daemon_detach: real double-fork backgrounding path (--daemon without
        --no-detach); slower/fragile, so it runs in the full suite but not the
        fast PR gate
    parity: differential rsync-parity case (full set; runs on push to
        dev/main)
    parity_ci: fast differential rsync-parity subset (runs on the PR gate)
