name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc cmake libzstd-dev

      - name: Configure
        run: cmake -B build -S .

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Unit Tests
        run: ./build/tests
